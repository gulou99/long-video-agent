project:
  default_duration_seconds: 600
  language: zh-CN
  aspect_ratio: "16:9"
  resolution: 1920x1080
  fps: 30
pipeline:
  max_shot_duration_seconds: 12
  max_parallel_shots: 2
  checkpoint_after_every_stage: true
  resume_from_last_checkpoint: true
quality:
  max_regenerations_per_shot: 2
  duration_tolerance_seconds: 1.0
  require_character_references: true
providers:
  llm: ${LLM_MODEL}
  image: ${IMAGE_MODEL}
  video: ${VIDEO_MODEL}
  speech: ${TTS_MODEL}
render:
  backend: ffmpeg
  video_codec: h264
  audio_codec: aac
